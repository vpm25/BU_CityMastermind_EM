};

const G="#27ae60", DG="#1a6b3a", LG="#f0faf4", BD="#d5ede0";

function Btn({ children, onClick, disabled, style={}, outline=false, className }) {
  const base = {
    padding:"14px 24px", borderRadius:"10px", fontWeight:"700", fontSize:"14px",
    cursor:disabled?"not-allowed":"pointer", border:"none", transition:"all .2s",
    opacity:disabled?0.4:1,
    background:outline?"#fff":`linear-gradient(135deg,${DG},${G})`,
    color:outline?DG:"#fff",
    border:outline?`2px solid ${BD}`:"none",
    boxShadow:outline?"none":"0 4px 15px rgba(39,174,96,.25)",
    ...style,
  };
  return <button className={className} onClick={onClick} disabled={disabled} style={base}>{children}</button>;
}

function SmallBtn({ children, onClick, disabled, color="green" }) {
  const colors = {
    green:  { bg:"#f0faf4", border:BD,     text:DG },
    red:    { bg:"#fff2f2", border:"#faa", text:"#c0392b" },
    white:  { bg:"#fff",    border:BD,     text:"#3a6a4a" },
  };
  const c = colors[color] || colors.green;
  return (
    <button onClick={onClick} disabled={disabled} style={{
      padding:"6px 12px", borderRadius:"7px", fontSize:"11px", fontWeight:"700",
      cursor:disabled?"not-allowed":"pointer", border:`2px solid ${c.border}`,
      background:c.bg, color:c.text, opacity:disabled?.4:1, transition:"all .2s",
    }}>{children}</button>
  );
}

// ════════════ FIREBASE HELPERS ════════════
function getFB() { return window.FB; }

async function fbLoadQuestions() {
  const FB = getFB();
  const snap = await FB.getDocs(FB.collection(FB.db, "questions"));
  const arr = [];
  snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
  arr.sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
  return arr;
}

async function fbSaveQuestion(q) {
  const FB = getFB();
  if (q.id && typeof q.id === "string" && q.id.length > 5) {
    const ref = FB.doc(FB.db, "questions", q.id);
    const { id, ...data } = q;
    await FB.setDoc(ref, data);
    return q.id;
  } else {
    const { id, ...data } = q;
    const ref = await FB.addDoc(FB.collection(FB.db, "questions"), data);
    return ref.id;
  }
}

async function fbDeleteQuestion(id) {
  const FB = getFB();
  await FB.deleteDoc(FB.doc(FB.db, "questions", id));
}

async function fbCreateParticipant(meta) {
  const FB = getFB();
  const ref = await FB.addDoc(FB.collection(FB.db, "participants"), {
    ...meta,
    answers: {},
    question_snapshots: {},
    started_at: FB.serverTimestamp(),
    last_updated: FB.serverTimestamp(),
  });
  return ref.id;
}

async function fbUpdateParticipantLang(participantId, lang, langName, flag) {
  const FB = getFB();
  await FB.updateDoc(FB.doc(FB.db, "participants", participantId), {
    lang, lang_name: langName, flag, last_updated: FB.serverTimestamp(),
  });
}

async function fbSaveAnswer(participantId, qId, qSnapshot, answer) {
  const FB = getFB();
  const ref = FB.doc(FB.db, "participants", participantId);
  await FB.updateDoc(ref, {
    [`answers.${qId}`]: answer || "",
    [`question_snapshots.${qId}`]: qSnapshot || "",
    last_updated: FB.serverTimestamp(),
  });
}

async function fbMarkFinished(participantId) {
  const FB = getFB();
  const ref = FB.doc(FB.db, "participants", participantId);
  await FB.updateDoc(ref, {
    finished_at: FB.serverTimestamp(),
    last_updated: FB.serverTimestamp(),
  });
}

async function fbLoadParticipants() {
  const FB = getFB();
  const q = FB.query(FB.collection(FB.db, "participants"), FB.orderBy("started_at", "desc"));
  const snap = await FB.getDocs(q);
  const arr = [];
  snap.forEach(d => {
    const data = d.data();
    arr.push({
      id: d.id, ...data,
      started_at_display: data.started_at?.toDate ? data.started_at.toDate().toLocaleString() : "",
      finished_at_display: data.finished_at?.toDate ? data.finished_at.toDate().toLocaleString() : "",
    });
  });
  return arr;
}

async function fbDeleteParticipant(id) {
  const FB = getFB();
  await FB.deleteDoc(FB.doc(FB.db, "participants", id));
}

async function fbDeleteAllParticipants() {
  const FB = getFB();
  const snap = await FB.getDocs(FB.collection(FB.db, "participants"));
  await Promise.all([...snap.docs].map(d => FB.deleteDoc(FB.doc(FB.db, "participants", d.id))));
}

// ── Session: doc meta/session con { open: bool } ──
async function fbLoadSession() {
  const FB = getFB();
  const ref = FB.doc(FB.db, "meta", "session");
  const snap = await FB.getDoc(ref);
  if (!snap.exists()) {
    const initial = { open: false, current_question_id: null, current_question_data: null };
    await FB.setDoc(ref, initial);
    return initial;
  }
  return snap.data();
}

async function fbSetSession(data) {
  const FB = getFB();
  const ref = FB.doc(FB.db, "meta", "session");
  await FB.setDoc(ref, { ...data, last_update: FB.serverTimestamp() }, { merge: true });
}

// Mostrar una pregunta a todos los participantes (current). Abre la sesión si estaba cerrada.
async function fbShowQuestion(q) {
  await fbSetSession({
    open: true,
    current_question_id: q.id,
    current_question_data: {
      id: q.id, en: q.en, translations: q.translations || {},
    },
  });
}

// Terminar el survey: cerrar sesión, no hay pregunta actual.
async function fbEndSurveyDoc() {
  await fbSetSession({
    open: false,
    current_question_id: null,
    current_question_data: null,
  });
}

// ════════════ APP ════════════
function App() {
  const [screen,    setScreen]    = useState("lang"); // lang | survey | waiting | done | adminLogin | admin
  const [lang,      setLang]      = useState("en");
  const [answers,      setAnswers]      = useState({});  // texto del textarea (incluye drafts)
  const [submittedIds, setSubmittedIds] = useState(new Set()); // qIds ya enviados con botón
  const [questions, setQuestions] = useState([]);
  const [loadingQs, setLoadingQs] = useState(true);

  const [participantId, setParticipantId] = useState(null);
  const [saving,        setSaving]        = useState(false);
  const [submitErr,     setSubmitErr]     = useState(null);

  // Session state — fuente única de verdad
  const [session,       setSession]       = useState({ open: false, current_question_id: null, current_question_data: null });
  const sessionOpen = session.open === true;

  // Admin
  const [pw,           setPw]           = useState("");
  const [pwErr,        setPwErr]        = useState(false);
  const [tab,          setTab]          = useState("responses");
  const [participants, setParticipants] = useState([]);
  const [editQ,        setEditQ]        = useState(null);
  const [newQText,     setNewQText]     = useState("");
  const [savingQ,      setSavingQ]      = useState(false);
  const [copied,       setCopied]       = useState(false);
  const [viewMode,     setViewMode]     = useState("question");  // "participant" | "question"
  const [expandedIds,  setExpandedIds]  = useState(new Set());   // Set de ids expandidos

  const t = UI[lang] || UI.en;

  // currentQ viene del session.current_question_data — fuente única para los participantes
  const currentQ = (session.current_question_id && !submittedIds.has(session.current_question_id))
    ? session.current_question_data
    : null;
  const answeredCount = submittedIds.size;

  const getLang = (q, lang) => {
    if (!q) return "";
    if (lang === "en") return q.en || "";
    return (q.translations || {})[lang] || q.en || "";
  };

  // ── Load questions on mount ──
  useEffect(() => {
    (async () => {
      try {
        const qs = await fbLoadQuestions();
        setQuestions(qs);
      } catch (e) { console.error(e); }
      finally { setLoadingQs(false); }
    })();
  }, []);

  // ── Load session state on mount ──
  useEffect(() => {
    (async () => {
      try {
        const s = await fbLoadSession();
        setSession(s);
      } catch (e) { console.error(e); }
    })();
  }, []);

  // ── Load participants when entering admin ──
  useEffect(() => {
    if (screen !== "admin") return;
    (async () => {
      try {
        const ps = await fbLoadParticipants();
        setParticipants(ps);
      } catch (e) { console.error(e); }
    })();
  }, [screen, tab]);

  // ── Polling EN SURVEY Y WAITING: cada 8-14s (con jitter) leer meta/session ──
  // Solo 1 read por poll. Para 1200 personas distribuidas: ~120 reads/seg, perfectamente manejable.
  // El jitter evita que las 1200 peticiones lleguen al mismo segundo.
  const pollRef = useRef(null);
  const submittedRef = useRef(submittedIds);
  const answersRef = useRef(answers);
  const participantRef = useRef(participantId);
  useEffect(() => { submittedRef.current = submittedIds; }, [submittedIds]);
  useEffect(() => { answersRef.current = answers; }, [answers]);
  useEffect(() => { participantRef.current = participantId; }, [participantId]);

  useEffect(() => {
    const isParticipantScreen = screen === "survey" || screen === "waiting";
    if (!isParticipantScreen) {
      if (pollRef.current) { clearTimeout(pollRef.current); pollRef.current = null; }
      return;
    }
    let cancelled = false;
    const check = async () => {
      if (cancelled) return;
      try {
        const s = await fbLoadSession();
        if (cancelled) return;
        setSession(s);
        // Sesión cerrada → done (después de auto-guardar pendiente)
        if (s.open === false) {
          // Si tenían texto sin enviar de la pregunta actual, guardarlo
          const localCurrent = s.current_question_id;
          if (localCurrent && participantRef.current && !submittedRef.current.has(localCurrent)) {
            const txt = (answersRef.current[localCurrent] || "").trim();
            try {
              await fbSaveAnswer(participantRef.current, localCurrent, s.current_question_data?.en || "", txt);
              setSubmittedIds(prev => new Set([...prev, localCurrent]));
            } catch (e) { console.error(e); }
          }
          if (!cancelled) setScreen("done");
          return;
        }
        // Hay pregunta actual? Si no la contesté → ir a survey
        if (s.current_question_id && !submittedRef.current.has(s.current_question_id)) {
          if (!cancelled) setScreen("survey");
        } else {
          // No hay pregunta o ya la contesté → waiting
          if (!cancelled) setScreen("waiting");
        }
      } catch (e) { console.error(e); }
    };
    // Run check immediately, then schedule with jitter
    const schedule = () => {
      const delay = 8000 + Math.random() * 6000; // 8-14 seg
      pollRef.current = setTimeout(async () => {
        await check();
        if (!cancelled) schedule();
      }, delay);
    };
    check();
    schedule();
    return () => {
      cancelled = true;
      if (pollRef.current) { clearTimeout(pollRef.current); pollRef.current = null; }
    };
  }, [screen === "survey" || screen === "waiting"]);

  // ── Survey flow ──
  // Unificado: si NO hay participante → crea uno nuevo. Si YA hay → cambia idioma.
  const pickLang = async (code) => {
    setLang(code);
    setSubmitErr(null);
    const info = LANGS.find(l => l.code === code);

    // Caso 1: cambiar idioma de un participante existente
    if (participantId) {
      try {
        await fbUpdateParticipantLang(participantId, code, info?.full || code, info?.flag || "");
      } catch (e) { console.error(e); }
      // Volver a la pantalla apropiada
      setScreen(currentQ ? "survey" : "waiting");
      return;
    }

    // Caso 2: nuevo participante
    try {
      const s = await fbLoadSession();
      setSession(s);
      const id = await fbCreateParticipant({
        lang: code,
        lang_name: info?.full || code,
        flag: info?.flag || "",
      });
      setParticipantId(id);
      setAnswers({});
      setSubmittedIds(new Set());
      // Decidir pantalla según el estado de la sesión
      if (s.open === false) setScreen("done");
      else if (s.current_question_id) setScreen("survey");
      else setScreen("waiting");
    } catch (e) {
      alert("Could not start survey: " + e.message);
    }
  };

  const changeAnswer = (val) => {
    if (!currentQ) return;
    setAnswers(prev => ({ ...prev, [currentQ.id]: val }));
  };

  const handleNext = async () => {
    if (!currentQ || !participantId) return;
    const q = currentQ;
    const txt = (answers[q.id] || "").trim();

    setSaving(true);
    setSubmitErr(null);
    try {
      await fbSaveAnswer(participantId, q.id, q.en, txt);
      // Marcar la pregunta como ENVIADA
      const newSubmitted = new Set([...submittedIds, q.id]);
      setSubmittedIds(newSubmitted);

      // Recargar sesión para ver si admin ya cambió la pregunta o cerró el survey
      const s = await fbLoadSession();
      setSession(s);

      if (s.open === false) {
        await fbMarkFinished(participantId);
        setScreen("done");
      } else if (s.current_question_id && !newSubmitted.has(s.current_question_id)) {
        // Hay nueva pregunta para mostrar — el render lo hace solo (currentQ se recalcula)
        // Solo nos aseguramos de estar en "survey"
        setScreen("survey");
      } else {
        // No hay pregunta nueva o ya la contesté → waiting
        setScreen("waiting");
      }
    } catch (e) {
      setSubmitErr(e.message || "Could not save — please try again");
    } finally {
      setSaving(false);
    }
  };

  const reset = () => {
    setAnswers({}); setSubmittedIds(new Set()); setParticipantId(null); setSubmitErr(null); setScreen("lang");
  };

  // ── Admin ──
  const tryLogin = () => {
    if (pw !== ADMIN_PASSWORD) {
      setPwErr(true); setTimeout(() => setPwErr(false), 1600);
      return;
    }
    setPw(""); setScreen("admin");
  };

  const endSurvey = async () => {
    if (!window.confirm("End the survey?\n\nParticipants will see the thank-you screen.")) return;
    try {
      await fbEndSurveyDoc();
      setSession({ open: false, current_question_id: null, current_question_data: null });
    } catch (e) { alert("Error: " + e.message); }
  };

  // Mostrar una pregunta a todos los participantes
  const showQuestion = async (q) => {
    try {
      await fbShowQuestion(q);
      setSession(prev => ({
        ...prev,
        open: true,
        current_question_id: q.id,
        current_question_data: { id: q.id, en: q.en, translations: q.translations || {} },
      }));
    } catch (e) { alert("Error: " + e.message); }
  };

  // Pausar (volver a "waiting" sin cerrar el survey)
  const hideQuestion = async () => {
    try {
      await fbSetSession({ current_question_id: null, current_question_data: null });
      setSession(prev => ({ ...prev, current_question_id: null, current_question_data: null }));
    } catch (e) { alert("Error: " + e.message); }
  };

  const addQuestion = async () => {
    if (!newQText.trim() || questions.length >= 20) return;
    setSavingQ(true);
    try {
      const newQ = { en: newQText.trim(), translations: {}, order: questions.length };
      const id = await fbSaveQuestion(newQ);
      setQuestions(prev => [...prev, { id, ...newQ }]);
      setNewQText("");
    } catch (e) { alert("Error: " + e.message); }
    finally { setSavingQ(false); }
  };

  const deleteQ = async (q) => {
    if (!window.confirm(`¿Borrar la pregunta?\n\n"${q.en}"`)) return;
    try {
      await fbDeleteQuestion(q.id);
      setQuestions(prev => prev.filter(x => x.id !== q.id));
    } catch (e) { alert("Error: " + e.message); }
  };

  const saveEdit = async () => {
    if (!editQ?.en?.trim()) return;
    setSavingQ(true);
    try {
      await fbSaveQuestion(editQ);
      setQuestions(prev => prev.map(x => x.id === editQ.id ? editQ : x));
      // Si esta pregunta está siendo mostrada, actualizar también la session
      if (session.current_question_id === editQ.id) {
        await fbShowQuestion(editQ);
        setSession(prev => ({
          ...prev,
          current_question_data: { id: editQ.id, en: editQ.en, translations: editQ.translations || {} },
        }));
      }
      setEditQ(null);
    } catch (e) { alert("Error: " + e.message); }
    finally { setSavingQ(false); }
  };

  const deletePart = async (id) => {
    if (!window.confirm("¿Borrar este participante y todas sus respuestas?")) return;
    try {
      await fbDeleteParticipant(id);
      setParticipants(prev => prev.filter(p => p.id !== id));
    } catch (e) { alert("Error: " + e.message); }
  };

  const deleteAll = async () => {
    if (!window.confirm("¿BORRAR TODOS los participantes y respuestas?")) return;
    try {
      await fbDeleteAllParticipants();
      setParticipants([]);
    } catch (e) { alert("Error: " + e.message); }
  };

  const reload = async () => {
    try {
      const ps = await fbLoadParticipants();
      setParticipants(ps);
    } catch (e) { alert("Error: " + e.message); }
  };

  const buildExportRows = () => {
    const liveIds = new Set(questions.map(q => q.id));
    const orphans = new Map();
    for (const p of participants) {
      for (const qId of Object.keys(p.answers || {})) {
        if (!liveIds.has(qId)) {
          orphans.set(qId, (p.question_snapshots || {})[qId] || `(deleted ${qId})`);
        }
      }
    }
    const orphanIds = Array.from(orphans.keys());
    const headers = [
      "id","started","finished_at","status","language",
      ...questions.map((q, i) => `Q${i+1}: ${q.en.slice(0, 60)}`),
      ...orphanIds.map(qid => `(deleted) ${orphans.get(qid).slice(0, 60)}`),
    ];
    const rows = participants.map(p => {
      const answeredAll = questions.length > 0 && questions.every(q => (p.answers || {})[q.id] !== undefined);
      return [
        p.id, p.started_at_display || "", p.finished_at_display || "",
        answeredAll ? "completed" : "incomplete",
        p.lang_name || p.lang || "",
        ...questions.map(q => (p.answers || {})[q.id] || ""),
        ...orphanIds.map(qid => (p.answers || {})[qid] || ""),
      ];
    });
    return { headers, rows };
  };

  const exportCSV = () => {
    if (!participants.length) return;
    const { headers, rows } = buildExportRows();
    const esc = c => `"${String(c).replace(/"/g, '""')}"`;
    const csv = [headers, ...rows].map(r => r.map(esc).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `survey_${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(url);
  };

  const copyTable = () => {
    if (!participants.length) return;
    const { headers, rows } = buildExportRows();
    const tsv = [headers, ...rows].map(r => r.join("\t")).join("\n");
    navigator.clipboard.writeText(tsv).then(() => {
      setCopied(true); setTimeout(() => setCopied(false), 2000);
    });
  };

  // Stats: completed = answered all currently active questions
  const totalCompleted = participants.filter(p =>
    questions.length > 0 && questions.every(q => (p.answers || {})[q.id] !== undefined)
  ).length;
  const totalIncomplete = participants.length - totalCompleted;

  // ════════════ RENDER ════════════
  return (
    <div className="app">

      {/* LANG (welcome / cambio de idioma) */}
      {screen === "lang" && (
        <div className="center">
          <div style={{maxWidth:"720px",width:"100%"}}>
            <div style={{textAlign:"center",marginBottom:"32px"}}>
              <h1 style={{fontSize:"32px",fontWeight:"800",color:"#1a3a26",marginBottom:"10px"}}>Welcome</h1>
              <p style={{color:"#7aaa88",fontSize:"15px"}}>Choose your language to begin</p>
            </div>
            {loadingQs ? (
              <p style={{textAlign:"center",color:"#7aaa88"}}>Loading...</p>
            ) : (
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"12px"}}>
                {LANGS.map(l => (
                  <button key={l.code} className="lb" onClick={() => pickLang(l.code)} style={{
                    background:"#fff",
                    border:`2px solid ${BD}`,
                    borderRadius:"14px",padding:"24px 10px",cursor:"pointer",textAlign:"center",
                    color:"#1a3a26",boxShadow:"0 2px 8px rgba(27,107,58,.06)",transition:"all .2s",
                  }}>
                    <span style={{fontSize:"32px",display:"block",marginBottom:"8px"}}>{l.flag}</span>
                    <span style={{fontSize:"13px",fontWeight:"700",display:"block"}}>{l.name}</span>
                  </button>
                ))}
              </div>
            )}
            <div style={{textAlign:"center",marginTop:"32px"}}>
              <button onClick={() => setScreen("adminLogin")} style={{
                background:"none",border:"none",color:"#7aaa88",fontSize:"13px",cursor:"pointer",fontWeight:"600",
              }}>Admin →</button>
            </div>
          </div>
        </div>
      )}

      {/* SURVEY */}
      {screen === "survey" && currentQ && (
        <div className="center">
          <div style={{maxWidth:"600px",width:"100%"}}>
            {/* Top bar: change language */}
            <div style={{display:"flex",justifyContent:"flex-end",marginBottom:"20px"}}>
              <button onClick={() => setScreen("lang")} style={{
                background:"none",border:"none",color:"#7aaa88",fontSize:"13px",
                cursor:"pointer",fontFamily:"inherit",
              }}>{t.changeLang}</button>
            </div>

            <p style={{fontSize:"11px",letterSpacing:"3px",textTransform:"uppercase",color:G,marginBottom:"14px",fontWeight:"700"}}>
              {t.q} {String(answeredCount+1).padStart(2,"0")}
            </p>
            <h2 style={{fontSize:"24px",fontWeight:"700",lineHeight:"1.5",marginBottom:"26px"}}>
              {getLang(currentQ, lang)}
            </h2>

            <textarea value={answers[currentQ.id] || ""} onChange={e => changeAnswer(e.target.value)}
              placeholder={t.ph} rows={6}
              style={{
                width:"100%",background:"#fff",border:`2px solid ${BD}`,
                borderRadius:"12px",padding:"20px",color:"#1a3a26",
                fontSize:"15px",lineHeight:"1.7",resize:"vertical",outline:"none",
              }}
              onFocus={e => e.target.style.borderColor = G}
              onBlur={e => e.target.style.borderColor = BD}
            />

            {submitErr && (
              <div style={{
                marginTop:"12px",padding:"12px 14px",background:"#fff2f2",
                border:"2px solid #faa",borderRadius:"10px",
                color:"#c0392b",fontSize:"13px",fontWeight:"600",
              }}>⚠️ {submitErr}</div>
            )}

            {(() => {
              const hasText = (answers[currentQ.id] || "").trim().length > 0;
              // Con texto: Submit ✓ (verde sólido). Sin texto: Skip → (outline)
              const label = hasText ? `${t.submit} ✓` : `${t.submit} →`;
              return (
                <Btn className="nb" onClick={handleNext} disabled={saving}
                  style={{
                    width:"100%",marginTop:"16px",padding:"17px",fontSize:"14px",
                    background: hasText ? `linear-gradient(135deg,${DG},${G})` : "#fff",
                    color: hasText ? "#fff" : DG,
                    border: hasText ? "none" : `2px solid ${BD}`,
                    boxShadow: "none",
                  }}>
                  {saving ? "..." : label}
                </Btn>
              );
            })()}

            <p style={{textAlign:"center",fontSize:"11px",color:"#b0d4b8",marginTop:"12px"}}>
              {t.blank}
            </p>
          </div>
        </div>
      )}

      {/* WAITING (sesión abierta, esperando próxima pregunta o cierre) */}
      {screen === "waiting" && (
        <div className="center">
          <div style={{maxWidth:"440px",width:"100%",textAlign:"center"}}>
            <div style={{display:"flex",justifyContent:"flex-end",marginBottom:"20px"}}>
              <button onClick={() => setScreen("lang")} style={{
                background:"none",border:"none",color:"#7aaa88",fontSize:"13px",cursor:"pointer",
              }}>{t.changeLang}</button>
            </div>
            <div style={{
              width:"80px",height:"80px",background:`linear-gradient(135deg,${DG},${G})`,
              borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:"34px",margin:"0 auto 24px",boxShadow:"0 8px 24px rgba(39,174,96,.3)",
              animation:"pulse 2s infinite",
            }}>⏳</div>
            <h2 style={{fontSize:"28px",fontWeight:"800",marginBottom:"10px",color:"#1a3a26"}}>
              {t.waiting}
            </h2>
            <p style={{color:"#7aaa88",fontSize:"15px"}}>
              {t.waitingMsg}
            </p>
          </div>
        </div>
      )}

      {/* DONE (sesión cerrada → thank you) */}
      {screen === "done" && (
        <div className="center">
          <div style={{maxWidth:"420px",width:"100%",textAlign:"center"}}>
            <div style={{
              width:"80px",height:"80px",background:`linear-gradient(135deg,${DG},${G})`,
              borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:"34px",margin:"0 auto 24px",boxShadow:"0 8px 24px rgba(39,174,96,.3)",
            }}>✓</div>
            <h2 style={{fontSize:"34px",fontWeight:"800",marginBottom:"10px"}}>{t.thanks}</h2>
            <p style={{color:"#7aaa88",fontSize:"15px"}}>{t.saved}</p>
            <div style={{marginTop:"40px"}}>
              <button onClick={() => { reset(); setScreen("adminLogin"); }} style={{
                background:"none",border:"none",color:"#7aaa88",fontSize:"13px",cursor:"pointer",fontWeight:"600",
              }}>Admin →</button>
            </div>
          </div>
        </div>
      )}

      {/* ADMIN LOGIN */}
      {screen === "adminLogin" && (
        <div className="center">
          <div style={{maxWidth:"380px",width:"100%",textAlign:"center"}}>
            <div style={{
              width:"70px",height:"70px",background:`linear-gradient(135deg,${DG},${G})`,
              borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:"30px",margin:"0 auto 20px",boxShadow:"0 8px 24px rgba(39,174,96,.3)",
            }}>🔒</div>
            <h2 style={{fontSize:"26px",fontWeight:"800",marginBottom:"8px"}}>Admin Access</h2>
            <p style={{color:"#7aaa88",fontSize:"14px",marginBottom:"24px"}}>Enter password</p>
            <input type="password" value={pw}
              onChange={e => setPw(e.target.value)}
              onKeyDown={e => e.key === "Enter" && tryLogin()}
              placeholder="Password"
              style={{
                width:"100%",padding:"14px 18px",
                border:`2px solid ${pwErr ? "#e74c3c" : BD}`,
                borderRadius:"10px",fontSize:"15px",outline:"none",
                marginBottom:"8px",textAlign:"center",letterSpacing:"4px",
                background: pwErr ? "#fdf0ee" : "#fff",
              }}/>
            {pwErr
              ? <p style={{color:"#e74c3c",fontSize:"12px",marginBottom:"14px",fontWeight:"600"}}>❌ Incorrect password</p>
              : <div style={{height:"20px",marginBottom:"14px"}} />
            }
            <Btn onClick={tryLogin} style={{width:"100%"}}>Unlock →</Btn>
            <button onClick={() => setScreen("lang")} style={{
              marginTop:"14px",background:"none",border:"none",
              color:"#b0d4b8",fontSize:"12px",cursor:"pointer",
            }}>← Back to Survey</button>
          </div>
        </div>
      )}

      {/* ADMIN */}
      {screen === "admin" && (
        <div style={{padding:"24px 16px",maxWidth:"1100px",margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
            <h1 style={{fontSize:"24px",fontWeight:"800",color:"#1a3a26"}}>📊 Admin Dashboard</h1>
            <button onClick={() => setScreen("lang")} style={{
              background:"none",border:"none",color:"#7aaa88",fontSize:"13px",cursor:"pointer",
            }}>← Back to Survey</button>
          </div>

          {/* Status & End button */}
          <div style={{
            background:"#fff",border:`2px solid ${sessionOpen ? BD : "#fcc"}`,
            borderRadius:"14px",padding:"14px 18px",marginBottom:"24px",
            display:"flex",alignItems:"center",justifyContent:"space-between",gap:"14px",flexWrap:"wrap",
          }}>
            <div style={{fontSize:"13px",flex:1,minWidth:"200px"}}>
              {!sessionOpen ? (
                <>
                  <span style={{color:"#c0392b",fontWeight:"700"}}>🔴 Survey ended</span>
                  <span style={{color:"#7aaa88",marginLeft:"10px",fontSize:"12px"}}>
                    Press ▶ Show on any question to start.
                  </span>
                </>
              ) : session.current_question_id ? (
                <>
                  <span style={{color:DG,fontWeight:"700"}}>🟢 Showing now:</span>
                  <span style={{color:"#1a3a26",marginLeft:"8px",fontSize:"13px",fontWeight:"600"}}>
                    "{(session.current_question_data?.en || "").slice(0, 80)}"
                  </span>
                </>
              ) : (
                <>
                  <span style={{color:DG,fontWeight:"700"}}>🟢 Survey is live</span>
                  <span style={{color:"#7aaa88",marginLeft:"10px",fontSize:"12px"}}>
                    Participants are waiting. Press ▶ Show on a question.
                  </span>
                </>
              )}
            </div>
            <div style={{display:"flex",gap:"8px"}}>
              {sessionOpen && session.current_question_id && (
                <button onClick={hideQuestion} style={{
                  padding:"8px 14px",borderRadius:"10px",fontWeight:"700",fontSize:"12px",
                  cursor:"pointer",background:"#fff8f0",color:"#c0620b",
                  border:"2px solid #fcc",transition:"all .2s",
                }}>
                  ⏸ Pause (back to waiting)
                </button>
              )}
              {sessionOpen && (
                <button onClick={endSurvey} style={{
                  padding:"8px 14px",borderRadius:"10px",fontWeight:"800",fontSize:"12px",
                  cursor:"pointer",background:"#fff2f2",color:"#c0392b",
                  border:"2px solid #faa",transition:"all .2s",
                }}>
                  🔴 End Survey
                </button>
              )}
            </div>
          </div>

          {/* Tabs */}
          <div style={{display:"flex",gap:"8px",marginBottom:"20px",borderBottom:`2px solid ${BD}`}}>
            {[
              {id:"responses", label:`📥 Responses (${participants.length})`},
              {id:"questions", label:`❓ Questions (${questions.length})`},
            ].map(x => (
              <button key={x.id} onClick={() => setTab(x.id)} style={{
                padding:"10px 18px",background:"none",border:"none",
                borderBottom: tab === x.id ? `3px solid ${G}` : "3px solid transparent",
                color: tab === x.id ? DG : "#7aaa88",
                fontSize:"13px",fontWeight:"700",cursor:"pointer",marginBottom:"-2px",
              }}>{x.label}</button>
            ))}
          </div>

          {tab === "responses" && (
            <div>
              {participants.length > 0 && (
                <div style={{display:"flex",gap:"10px",marginBottom:"16px",flexWrap:"wrap"}}>
                  <div style={{padding:"10px 16px",background:"#fff",border:`2px solid ${BD}`,borderRadius:"10px",fontSize:"12px"}}>
                    <span style={{color:"#7aaa88"}}>Total: </span>
                    <strong style={{color:DG}}>{participants.length}</strong>
                  </div>
                  <div style={{padding:"10px 16px",background:"#fff",border:`2px solid ${BD}`,borderRadius:"10px",fontSize:"12px"}}>
                    <span style={{color:"#7aaa88"}}>✓ Completed: </span>
                    <strong style={{color:DG}}>{totalCompleted}</strong>
                  </div>
                  <div style={{padding:"10px 16px",background:"#fff",border:`2px solid ${BD}`,borderRadius:"10px",fontSize:"12px"}}>
                    <span style={{color:"#7aaa88"}}>⏳ Incomplete: </span>
                    <strong style={{color:"#c0620b"}}>{totalIncomplete}</strong>
                  </div>
                </div>
              )}

              {/* View toggle */}
              <div style={{
                display:"flex",gap:"4px",marginBottom:"16px",
                background:"#fff",border:`2px solid ${BD}`,borderRadius:"10px",padding:"4px",width:"fit-content",
              }}>
                {[
                  {id:"question",    label:"📝 By Question"},
                  {id:"participant", label:"👤 By Participant"},
                ].map(v => (
                  <button key={v.id} onClick={() => { setViewMode(v.id); setExpandedIds(new Set()); }} style={{
                    padding:"8px 16px",border:"none",borderRadius:"7px",fontSize:"12px",fontWeight:"700",
                    cursor:"pointer",transition:"all .2s",
                    background: viewMode === v.id ? `linear-gradient(135deg,${DG},${G})` : "transparent",
                    color: viewMode === v.id ? "#fff" : "#7aaa88",
                  }}>{v.label}</button>
                ))}
              </div>

              <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"20px"}}>
                <SmallBtn onClick={exportCSV} disabled={!participants.length}>📥 Export CSV</SmallBtn>
                <SmallBtn onClick={copyTable} disabled={!participants.length}>
                  {copied ? "✓ Copied!" : "📋 Copy as table"}
                </SmallBtn>
                <SmallBtn onClick={reload}>🔄 Reload</SmallBtn>
                {((viewMode === "participant" && participants.length > 0) ||
                  (viewMode === "question" && questions.length > 0)) && (
                  <>
                    <SmallBtn color="white" onClick={() => {
                      const all = viewMode === "participant"
                        ? new Set(participants.map(p => p.id))
                        : new Set(questions.map(q => q.id));
                      setExpandedIds(all);
                    }}>⊞ Expand all</SmallBtn>
                    <SmallBtn color="white" onClick={() => setExpandedIds(new Set())}>
                      ⊟ Collapse all
                    </SmallBtn>
                  </>
                )}
                <div style={{flex:1}} />
                <SmallBtn onClick={deleteAll} disabled={!participants.length} color="red">🗑 Delete all</SmallBtn>
              </div>

              {!participants.length ? (
                <div style={{
                  textAlign:"center",padding:"60px 20px",
                  background:"#fff",border:`2px dashed ${BD}`,borderRadius:"14px",color:"#7aaa88",
                }}>No responses yet.</div>
              ) : viewMode === "question" ? (
                /* ─── BY QUESTION ─── */
                <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
                  {questions.length === 0 ? (
                    <div style={{
                      textAlign:"center",padding:"40px 20px",
                      background:"#fff",border:`2px dashed ${BD}`,borderRadius:"14px",color:"#7aaa88",
                    }}>No questions defined. Switch to "By Participant" to see orphan answers.</div>
                  ) : questions.map((q, qi) => {
                    // Filtrar participantes que TIENEN respuesta para esta pregunta (no undefined)
                    const responses = participants
                      .filter(p => (p.answers || {})[q.id] !== undefined)
                      .map(p => ({
                        pid: p.id, lang: p.lang_name || p.lang, flag: p.flag,
                        answer: p.answers[q.id], time: p.started_at_display,
                      }));
                    const withText = responses.filter(r => r.answer && r.answer.trim());
                    const skipped = responses.length - withText.length;
                    const isExpanded = expandedIds.has(q.id);
                    return (
                      <div key={q.id} style={{
                        background:"#fff",border:`2px solid ${BD}`,borderRadius:"14px",
                        boxShadow:"0 2px 8px rgba(27,107,58,.05)",overflow:"hidden",
                      }}>
                        <div onClick={() => {
                          const next = new Set(expandedIds);
                          if (next.has(q.id)) next.delete(q.id); else next.add(q.id);
                          setExpandedIds(next);
                        }} style={{
                          padding:"16px 18px",cursor:"pointer",display:"flex",
                          alignItems:"center",justifyContent:"space-between",gap:"10px",
                          background: isExpanded ? LG : "#fff",
                          transition:"background .2s",
                        }}>
                          <div style={{display:"flex",alignItems:"center",gap:"12px",flex:1,minWidth:0}}>
                            <span style={{
                              fontSize:"11px",fontWeight:"800",color:DG,
                              background:LG,padding:"4px 8px",borderRadius:"6px",flexShrink:0,
                            }}>Q{qi+1}</span>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:"14px",fontWeight:"700",color:"#1a3a26",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                                {q.en}
                              </div>
                              <div style={{fontSize:"11px",color:"#7aaa88",marginTop:"2px"}}>
                                {withText.length} answered · {skipped} skipped
                              </div>
                            </div>
                          </div>
                          <span style={{fontSize:"14px",color:"#7aaa88",flexShrink:0}}>
                            {isExpanded ? "▲" : "▼"}
                          </span>
                        </div>

                        {isExpanded && (
                          <div style={{padding:"6px 18px 18px",display:"flex",flexDirection:"column",gap:"8px"}}>
                            {responses.length === 0 ? (
                              <p style={{fontSize:"12px",color:"#bbb",fontStyle:"italic",padding:"8px 0"}}>
                                No participant has reached this question yet.
                              </p>
                            ) : responses.map((r, ri) => (
                              <div key={r.pid} style={{
                                padding:"10px 12px",
                                background: r.answer && r.answer.trim() ? LG : "#fafafa",
                                borderRadius:"8px",
                                borderLeft: r.answer && r.answer.trim() ? `3px solid ${G}` : `3px solid #ddd`,
                              }}>
                                <div style={{fontSize:"11px",color:"#7aaa88",marginBottom:"4px",fontWeight:"600"}}>
                                  {r.flag || "🏳️"} {r.lang}
                                </div>
                                <div style={{
                                  fontSize:"13px",lineHeight:"1.5",
                                  color: r.answer && r.answer.trim() ? "#1a3a26" : "#bbb",
                                  fontStyle: r.answer && r.answer.trim() ? "normal" : "italic",
                                }}>
                                  {r.answer && r.answer.trim() ? r.answer : "(skipped)"}
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}

                  {/* Sección de orphans (preguntas borradas) */}
                  {(() => {
                    const liveIds = new Set(questions.map(q => q.id));
                    const orphanMap = new Map(); // qId -> { snapshot, answers: [] }
                    for (const p of participants) {
                      for (const qId of Object.keys(p.answers || {})) {
                        if (liveIds.has(qId)) continue;
                        if (!orphanMap.has(qId)) {
                          orphanMap.set(qId, {
                            snapshot: (p.question_snapshots || {})[qId] || `(deleted question)`,
                            answers: [],
                          });
                        }
                        orphanMap.get(qId).answers.push({
                          pid: p.id, lang: p.lang_name || p.lang, flag: p.flag,
                          answer: p.answers[qId],
                        });
                      }
                    }
                    if (orphanMap.size === 0) return null;
                    return Array.from(orphanMap.entries()).map(([qId, data]) => {
                      const isExpanded = expandedIds.has(qId);
                      const withText = data.answers.filter(r => r.answer && r.answer.trim());
                      return (
                        <div key={qId} style={{
                          background:"#fff8f0",border:`2px dashed #fcc`,borderRadius:"14px",overflow:"hidden",
                        }}>
                          <div onClick={() => {
                            const next = new Set(expandedIds);
                            if (next.has(qId)) next.delete(qId); else next.add(qId);
                            setExpandedIds(next);
                          }} style={{
                            padding:"14px 18px",cursor:"pointer",display:"flex",
                            alignItems:"center",justifyContent:"space-between",gap:"10px",
                          }}>
                            <div style={{display:"flex",alignItems:"center",gap:"12px",flex:1,minWidth:0}}>
                              <span style={{
                                fontSize:"10px",fontWeight:"800",color:"#c0620b",
                                background:"#fff",padding:"4px 8px",borderRadius:"6px",flexShrink:0,
                                border:"1px solid #fcc",
                              }}>DELETED</span>
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{fontSize:"13px",fontWeight:"600",color:"#3a5a46",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                                  {data.snapshot}
                                </div>
                                <div style={{fontSize:"11px",color:"#c0620b",marginTop:"2px"}}>
                                  {withText.length} answered · {data.answers.length - withText.length} skipped
                                </div>
                              </div>
                            </div>
                            <span style={{fontSize:"14px",color:"#7aaa88",flexShrink:0}}>
                              {isExpanded ? "▲" : "▼"}
                            </span>
                          </div>
                          {isExpanded && (
                            <div style={{padding:"6px 18px 18px",display:"flex",flexDirection:"column",gap:"8px"}}>
                              {data.answers.map(r => (
                                <div key={r.pid} style={{
                                  padding:"10px 12px",background:"#fff",borderRadius:"8px",
                                  borderLeft: r.answer && r.answer.trim() ? `3px solid ${G}` : `3px solid #ddd`,
                                }}>
                                  <div style={{fontSize:"11px",color:"#7aaa88",marginBottom:"4px",fontWeight:"600"}}>
                                    {r.flag || "🏳️"} {r.lang}
                                  </div>
                                  <div style={{
                                    fontSize:"13px",lineHeight:"1.5",
                                    color: r.answer && r.answer.trim() ? "#1a3a26" : "#bbb",
                                    fontStyle: r.answer && r.answer.trim() ? "normal" : "italic",
                                  }}>
                                    {r.answer && r.answer.trim() ? r.answer : "(skipped)"}
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    });
                  })()}
                </div>
              ) : (
                /* ─── BY PARTICIPANT ─── */
                <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
                  {participants.map((p, idx) => {
                    const liveIds = new Set(questions.map(q => q.id));
                    const orphanItems = Object.keys(p.answers || {})
                      .filter(qId => !liveIds.has(qId))
                      .map(qId => ({
                        qId,
                        text: (p.question_snapshots || {})[qId] || "(deleted question)",
                        answer: p.answers[qId],
                      }));
                    // Solo preguntas vivas que el participante haya CONTESTADO
                    const answeredLive = questions.filter(q => (p.answers || {})[q.id] !== undefined);
                    const totalAnswered = answeredLive.length + orphanItems.length;
                    const completed = questions.length > 0 && questions.every(q => (p.answers || {})[q.id] !== undefined);
                    const isExpanded = expandedIds.has(p.id);
                    return (
                      <div key={p.id} style={{
                        background:"#fff",border:`2px solid ${BD}`,borderRadius:"14px",
                        boxShadow:"0 2px 8px rgba(27,107,58,.05)",overflow:"hidden",
                      }}>
                        <div onClick={() => {
                          const next = new Set(expandedIds);
                          if (next.has(p.id)) next.delete(p.id); else next.add(p.id);
                          setExpandedIds(next);
                        }} style={{
                          padding:"14px 18px",cursor:"pointer",display:"flex",
                          alignItems:"center",justifyContent:"space-between",gap:"10px",
                          background: isExpanded ? LG : "#fff",
                          transition:"background .2s",
                        }}>
                          <div style={{display:"flex",alignItems:"center",gap:"12px",flex:1,minWidth:0}}>
                            <span style={{fontSize:"22px",flexShrink:0}}>{p.flag || "🏳️"}</span>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:"14px",fontWeight:"800",color:DG}}>
                                #{idx+1} · {p.lang_name || p.lang}
                              </div>
                              <div style={{fontSize:"11px",color:"#7aaa88"}}>
                                {totalAnswered} answer{totalAnswered === 1 ? "" : "s"} · {p.started_at_display}
                              </div>
                            </div>
                          </div>
                          <div style={{display:"flex",gap:"8px",alignItems:"center",flexShrink:0}}>
                            <span style={{
                              fontSize:"10px",fontWeight:"700",letterSpacing:"1px",
                              padding:"4px 9px",borderRadius:"6px",
                              background: completed ? LG : "#fff8f0",
                              color: completed ? DG : "#c0620b",
                              border: `1px solid ${completed ? BD : "#fcc"}`,
                            }}>
                              {completed ? "✓ COMPLETED" : "⏳ INCOMPLETE"}
                            </span>
                            <button onClick={e => { e.stopPropagation(); deletePart(p.id); }} title="Delete participant" style={{
                              background:"none",border:"none",color:"#c0392b",
                              cursor:"pointer",fontSize:"16px",padding:"0 4px",
                            }}>🗑</button>
                            <span style={{fontSize:"14px",color:"#7aaa88"}}>
                              {isExpanded ? "▲" : "▼"}
                            </span>
                          </div>
                        </div>

                        {isExpanded && (
                          <div style={{padding:"6px 18px 18px",display:"flex",flexDirection:"column",gap:"8px"}}>
                            {answeredLive.length === 0 && orphanItems.length === 0 ? (
                              <p style={{fontSize:"12px",color:"#bbb",fontStyle:"italic",padding:"8px 0"}}>
                                This participant hasn't answered any question yet.
                              </p>
                            ) : (
                              <>
                                {answeredLive.map(q => {
                                  const a = p.answers[q.id];
                                  const qi = questions.findIndex(x => x.id === q.id);
                                  return (
                                    <div key={q.id} style={{
                                      padding:"10px 12px",
                                      background: a && a.trim() ? LG : "#fafafa",
                                      borderRadius:"8px",
                                      borderLeft: a && a.trim() ? `3px solid ${G}` : `3px solid #ddd`,
                                    }}>
                                      <div style={{fontSize:"11px",color:"#7aaa88",fontWeight:"600",marginBottom:"4px"}}>
                                        Q{qi+1}: {q.en}
                                      </div>
                                      <div style={{
                                        fontSize:"13px",lineHeight:"1.5",
                                        color: a && a.trim() ? "#1a3a26" : "#bbb",
                                        fontStyle: a && a.trim() ? "normal" : "italic",
                                      }}>
                                        {a && a.trim() ? a : "(skipped)"}
                                      </div>
                                    </div>
                                  );
                                })}

                                {orphanItems.length > 0 && (
                                  <div style={{
                                    marginTop:"6px",padding:"10px 12px",
                                    background:"#fff8f0",border:`1px dashed #fcc`,borderRadius:"8px",
                                  }}>
                                    <div style={{fontSize:"10px",color:"#c0620b",fontWeight:"700",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"6px"}}>
                                      Orphan answers (deleted questions)
                                    </div>
                                    {orphanItems.map(o => (
                                      <div key={o.qId} style={{marginBottom:"6px"}}>
                                        <div style={{fontSize:"11px",color:"#7aaa88"}}>{o.text}</div>
                                        <div style={{fontSize:"13px",color:"#3a5a46"}}>{o.answer || "(skipped)"}</div>
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {tab === "questions" && (
            <div>
              <div style={{display:"flex",flexDirection:"column",gap:"10px",marginBottom:"24px"}}>
                {questions.length === 0 && (
                  <p style={{color:"#7aaa88",textAlign:"center",padding:"30px"}}>
                    No questions yet. Add one below.
                  </p>
                )}
                {questions.map((q, i) => (
                  <div key={q.id} style={{
                    background:"#fff",border:`2px solid ${BD}`,borderRadius:"12px",padding:"14px 16px",
                  }}>
                    {editQ?.id === q.id ? (
                      <div>
                        <label style={{fontSize:"11px",color:"#7aaa88",fontWeight:"700",letterSpacing:"1px",textTransform:"uppercase"}}>
                          🇬🇧 English (canonical)
                        </label>
                        <textarea value={editQ.en} rows={2}
                          onChange={e => setEditQ({...editQ, en: e.target.value})}
                          style={{
                            width:"100%",padding:"10px",marginTop:"6px",marginBottom:"14px",
                            border:`2px solid ${BD}`,borderRadius:"8px",fontSize:"14px",
                            resize:"vertical",outline:"none",
                          }}/>
                        <label style={{fontSize:"11px",color:"#7aaa88",fontWeight:"700",letterSpacing:"1px",textTransform:"uppercase"}}>
                          🌐 Translations (optional — leave empty to fall back to English)
                        </label>
                        <div style={{display:"flex",flexDirection:"column",gap:"8px",marginTop:"8px",marginBottom:"14px"}}>
                          {LANGS.filter(l => l.code !== "en").map(l => (
                            <div key={l.code} style={{display:"flex",gap:"8px",alignItems:"center"}}>
                              <span style={{fontSize:"18px",width:"24px"}}>{l.flag}</span>
                              <span style={{fontSize:"11px",width:"80px",color:"#7aaa88",fontWeight:"600"}}>{l.full}</span>
                              <input type="text"
                                value={editQ.translations?.[l.code] || ""}
                                placeholder={`(empty = use English)`}
                                onChange={e => setEditQ({
                                  ...editQ,
                                  translations: { ...(editQ.translations || {}), [l.code]: e.target.value },
                                })}
                                style={{
                                  flex:1,padding:"6px 10px",
                                  border:`1px solid ${BD}`,borderRadius:"6px",
                                  fontSize:"13px",outline:"none",
                                }}/>
                            </div>
                          ))}
                        </div>
                        <div style={{display:"flex",gap:"8px"}}>
                          <SmallBtn onClick={saveEdit} disabled={savingQ}>
                            {savingQ ? "Saving..." : "✓ Save"}
                          </SmallBtn>
                          <SmallBtn onClick={() => setEditQ(null)} color="white">Cancel</SmallBtn>
                        </div>
                      </div>
                    ) : (
                      <div style={{display:"flex",alignItems:"center",gap:"10px",
                        background: session.current_question_id === q.id ? LG : "transparent",
                        margin: session.current_question_id === q.id ? "-4px -8px" : "0",
                        padding: session.current_question_id === q.id ? "10px 12px" : "0",
                        borderRadius: session.current_question_id === q.id ? "8px" : "0",
                      }}>
                        <span style={{
                          fontSize:"11px",fontWeight:"800",color:DG,
                          background: session.current_question_id === q.id ? "#fff" : LG,
                          padding:"4px 8px",borderRadius:"6px",
                        }}>Q{i+1}</span>
                        <div style={{flex:1,fontSize:"14px",color:"#1a3a26"}}>{q.en}</div>
                        {session.current_question_id === q.id ? (
                          <span style={{
                            fontSize:"10px",fontWeight:"800",color:DG,letterSpacing:"1px",
                            background:"#fff",padding:"5px 10px",borderRadius:"6px",
                            border:`2px solid ${G}`,
                          }}>● SHOWING</span>
                        ) : (
                          <SmallBtn onClick={() => showQuestion(q)} color="green">
                            ▶ Show
                          </SmallBtn>
                        )}
                        <SmallBtn onClick={() => setEditQ({
                          ...q, translations: { ...(q.translations || {}) },
                        })}>✏️ Edit</SmallBtn>
                        <SmallBtn onClick={() => deleteQ(q)} color="red">🗑</SmallBtn>
                      </div>
                    )}
                  </div>
                ))}
              </div>

              {questions.length < 20 ? (
                <div style={{
                  background:"#fff",border:`2px dashed ${BD}`,borderRadius:"12px",padding:"16px",
                }}>
                  <p style={{fontSize:"12px",color:"#7aaa88",fontWeight:"700",marginBottom:"10px",letterSpacing:"1px",textTransform:"uppercase"}}>
                    ➕ Add question (in English)
                  </p>
                  <textarea value={newQText} rows={3}
                    placeholder="Type your question..."
                    onChange={e => setNewQText(e.target.value)}
                    style={{
                      width:"100%",padding:"12px",
                      border:`2px solid ${BD}`,borderRadius:"10px",
                      fontSize:"14px",resize:"vertical",outline:"none",marginBottom:"10px",
                    }}/>
                  <SmallBtn onClick={addQuestion} disabled={!newQText.trim() || savingQ}>
                    {savingQ ? "Adding..." : "✨ Add"}
                  </SmallBtn>
                  <p style={{fontSize:"11px",color:"#7aaa88",marginTop:"8px"}}>
                    Tip: After adding, click ✏️ Edit to add translations for other languages.
                  </p>
                </div>
              ) : (
                <p style={{textAlign:"center",fontSize:"12px",color:"#7aaa88"}}>
                  Maximum 20 questions reached.
                </p>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function mount() {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
}

if (window.FB) mount();
else window.addEventListener("firebase-ready", mount, { once: true });

</script>
</body>
</html>
